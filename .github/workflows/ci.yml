name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      EMBEDDING_BACKEND: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests evals
      - run: pytest -q --cov=app --cov-report=term-missing
      - name: Offline eval quality gate (routing / tools / grounding regressions)
        run: python -m evals.run_evals --tags challenge,rag,support,escalation,guardrail --min-route-acc 0.9
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t getnet-multi-agent:ci .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 -e LLM_PROVIDER=fake --name api getnet-multi-agent:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/ready && break; sleep 2; done
          curl -sf -X POST localhost:8000/chat -H 'Content-Type: application/json' \
            -d '{"message":"Can I sell through WhatsApp using the Payment Link?","user_id":"cliente1988"}'
